plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hostel.dietledger'
    compileSdk 34

    defaultConfig {
        applicationId "com.hostel.dietledger"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            storeFile file('release.keystore')
            storePassword 'dietledger123'
            keyAlias 'dietledger'
            keyPassword 'dietledger123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
